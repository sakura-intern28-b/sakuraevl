services:
  api:
    image: intern28-b.sakuracr.jp/intern2026-app-backend:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
      # フロントが別オリジンになる場合に指定（未指定だと http://localhost:3000 のみ許可）
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      # - COOKIE_SECURE=true   # HTTPS 配信時
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    image: intern28-b.sakuracr.jp/intern2026-app-frontend:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      # ブラウザから直接叩くURL。デプロイ先ではドメイン名やグローバルIPに変更する
      # （例: http://203.0.113.10:8080）
      - API_URL=${API_URL}
    depends_on:
      - api
    restart: on-failure

networks:
  default:
    name: app-network
