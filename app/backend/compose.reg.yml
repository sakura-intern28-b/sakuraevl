services:
  api:
    # BACKEND_TAG で焼き分けたイメージを差し替えて性能比較する。
    # 例: BACKEND_TAG=baseline / BACKEND_TAG=optimized (既定は latest)
    image: ${CR_URL}/intern2026-app-backend:${BACKEND_TAG:-latest}
    platform: linux/amd64
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
      # フロントが別オリジンになる場合に指定（未指定だと http://localhost:3000 のみ許可）
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      # トレース送信先。ホスト側で動く sacloud-otel-collector の OTLP/HTTP 受信口。
      # 未設定ならトレースを送信しない
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sakuravel-api}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      # どのイメージのトレースかを service.version で区別する。
      # モニタリングスイート側で service.version ごとに応答時間を比較できる。
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${BACKEND_TAG:-latest}
      # - COOKIE_SECURE=true   # HTTPS 配信時
    # コンテナからホスト側（Collector）へ到達するための名前解決
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  # ワンショットrunner: 外部DB(さくらのクラウド DBアプライアンス)に対して
  # schema_migrations で未適用のものだけ migrations/*.sql を適用して終了する。
  # 実体は migrate.sh (infra/terraform から配送)。
  migrate:
    image: mariadb:10.11
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  proxy:
    image: nginx:1.27-alpine
    # 公開ポートは infra/terraform の app_https_port / app_http_port から
    # .env (APP_HTTPS_PORT / APP_HTTP_PORT) 経由で渡される。
    ports:
      - "${APP_HTTPS_PORT:-4430}:443"
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12時間ごとに証明書の更新をチェック（Nginx稼働中のため必ずwebroot方式で更新）
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

  frontend:
    image: ${CR_URL}/intern2026-app-frontend:${FRONTEND_TAG:-latest}
    platform: linux/amd64
    environment:
      # ブラウザから直接叩くURL。デプロイ先ではドメイン名やグローバルIPに変更する
      # （例: http://203.0.113.10:8080）
      - API_URL=${API_URL}
    depends_on:
      - api
    restart: on-failure

networks:
  default:
    name: app-network
