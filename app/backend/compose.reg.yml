services:
  api:
    image: intern28-b.sakuracr.jp/intern2026-app-backend:latest
    platform: linux/amd64
    ports:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
      # フロントが別オリジンになる場合に指定（未指定だと http://localhost:3000 のみ許可）
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      # - COOKIE_SECURE=true   # HTTPS 配信時
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.11
    command: --event-scheduler=ON
    environment:
      MYSQL_DATABASE: sakuravel
      MYSQL_USER: sakuravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u sakuravel -ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    image: intern28-b.sakuracr.jp/intern2026-app-frontend:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      # ブラウザから直接叩くURL。デプロイ先ではドメイン名やグローバルIPに変更する
      # （例: http://203.0.113.10:8080）
      - API_URL=${API_URL}
    depends_on:
      - api
    restart: on-failure

networks:
  default:
    name: app-network
