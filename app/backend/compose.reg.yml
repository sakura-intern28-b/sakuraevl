services:
  api:
    image: ${CR_URL}/intern2026-app-backend:latest
    platform: linux/amd64
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
      # フロントが別オリジンになる場合に指定（未指定だと http://localhost:3000 のみ許可）
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      # - COOKIE_SECURE=true   # HTTPS 配信時
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  # ワンショットrunner: 外部DB(さくらのクラウド DBアプライアンス)に対して
  # schema_migrations で未適用のものだけ migrations/*.sql を適用して終了する。
  # 実体は migrate.sh (infra/terraform から配送)。
  migrate:
    image: mariadb:10.11
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "4430:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12時間ごとに証明書の更新をチェック
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  frontend:
    image: ${CR_URL}/intern2026-app-frontend:latest
    platform: linux/amd64
    environment:
      # ブラウザから直接叩くURL。デプロイ先ではドメイン名やグローバルIPに変更する
      # （例: http://203.0.113.10:8080）
      - API_URL=${API_URL}
    depends_on:
      - api
    restart: on-failure

networks:
  default:
    name: app-network
