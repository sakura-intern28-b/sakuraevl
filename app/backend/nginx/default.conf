log_format json_logs escape=json '{'
        '"time":"$time_iso8601",'
        '"http_protocol":"$server_protocol",'
        '"http_schema":"$scheme",'
        '"http_remote_addr":"$remote_addr",'
        '"http_remote_port":$remote_port,'
        '"host":"$host",'
        '"http_request_method":"$request_method",'
        '"http_request_uri":"$request_uri",'
        '"http_status":$status,'
        '"http_request_size":$request_length,'
        '"http_response_size":$bytes_sent,'
        '"http_latency_sec":$request_time,'
        '"http_user":"$remote_user",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

access_log /var/log/nginx/access.log json_logs;

upstream api_backend {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # クライアントからのボディサイズ上限
    client_max_body_size 10m;

    # ヘルスチェック（nginx 自身）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SSE（notifications/stream, thread/stream）はバッファリング無効が必須
    location ~ /stream$ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://api_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
