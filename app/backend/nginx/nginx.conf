
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # モニタリングスイート(Collectorのfilelog)が読むJSON形式。
    # 旧 default.conf から移設。フィールドを変えるとログのパースが壊れる。
    log_format json_logs escape=json '{'
            '"time":"$time_iso8601",'
            '"http_protocol":"$server_protocol",'
            '"http_schema":"$scheme",'
            '"http_remote_addr":"$remote_addr",'
            '"http_remote_port":$remote_port,'
            '"host":"$host",'
            '"http_request_method":"$request_method",'
            '"http_request_uri":"$request_uri",'
            '"http_status":$status,'
            '"http_request_size":$request_length,'
            '"http_response_size":$bytes_sent,'
            '"http_latency_sec":$request_time,'
            '"http_user":"$remote_user",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log  /var/log/nginx/access.log  json_logs;
    access_log  /var/log/nginx/access.log  main;
    access_log /dev/stdout;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;
        # server_name teamb.intern28.sakuraha.jp;

        # CertbotのACMEチャレンジ用
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # compose の healthcheck (wget http://127.0.0.1/healthz) 用。
        # HTTPSへのリダイレクトより先に完全一致で返す。
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # infra/terraform/monitoring.tf のシンプル監視は
        # http://<サーバーIP>:80/api/healthz に 200 を期待する。
        # HTTPSへリダイレクトすると監視が通らないため、ここだけ素通しする。
        location = /api/healthz {
            proxy_pass http://api:8080/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dockerヘルスチェック用 (https経由だと証明書のホスト名検証で失敗するため
        # リダイレクトさせずここで直接応答する)
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # それ以外はHTTPSへリダイレクト
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        # server_name teamb.intern28.sakuraha.jp;

        ssl_certificate /etc/letsencrypt/live/teamb.intern28.sakuraha.jp/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teamb.intern28.sakuraha.jp/privkey.pem;

        # セキュリティ強化（一般的な設定）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # SSE (GET /notifications/stream, GET /posts/{id}/thread/stream) は
        # バッファリングされると通知がリアルタイムに届かない。
        # 正規表現ロケーションは prefix ロケーションより優先されるため、
        # 下の location /api/ より先にこちらがマッチする。
        location ~ ^/api/(.*stream)$ {
            proxy_pass http://api:8080/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 1h;
        }

        # frontend (Next.js) 自身が持つランタイム設定エンドポイント。
        # /api/ プレフィックスと衝突するため、backendへの汎用ルールより先に
        # 完全一致で frontend へ転送する。
        location = /api/config {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # 末尾スラッシュにより /api/ プレフィックスを剥がしてbackendへ転送する
            # (例: /api/healthz -> http://api:8080/healthz)
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
