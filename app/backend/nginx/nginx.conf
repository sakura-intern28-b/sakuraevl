
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    access_log /dev/stdout;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;
        # server_name teamb.intern28.sakuraha.jp;

        # CertbotのACMEチャレンジ用
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Dockerヘルスチェック用 (https経由だと証明書のホスト名検証で失敗するため
        # リダイレクトさせずここで直接応答する)
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # それ以外はHTTPSへリダイレクト
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        # server_name teamb.intern28.sakuraha.jp;

        ssl_certificate /etc/letsencrypt/live/teamb.intern28.sakuraha.jp/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teamb.intern28.sakuraha.jp/privkey.pem;

        # セキュリティ強化（一般的な設定）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # frontend (Next.js) 自身が持つランタイム設定エンドポイント。
        # /api/ プレフィックスと衝突するため、backendへの汎用ルールより先に
        # 完全一致で frontend へ転送する。
        location = /api/config {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # 末尾スラッシュにより /api/ プレフィックスを剥がしてbackendへ転送する
            # (例: /api/healthz -> http://api:8080/healthz)
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
