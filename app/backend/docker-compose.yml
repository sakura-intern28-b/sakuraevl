services:
  api:
    build: .
    # 直接公開せず proxy 経由でのみアクセスさせる
    expose:
      - "8080"
    environment:
      - DATABASE_URL=sakuravel:password@tcp(db:3306)/sakuravel?parseTime=true&charset=utf8mb4
      - PORT=8080
      # トレース送信先。ホスト側で動く sacloud-otel-collector の OTLP/HTTP 受信口。
      # 未設定ならトレースを送信しない
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sakuravel-api}
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
    # コンテナからホスト側（Collector）へ到達するための名前解決
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.11
    command: --event-scheduler=ON
    environment:
      MYSQL_DATABASE: sakuravel
      MYSQL_USER: sakuravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u sakuravel -ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3


  frontend:
    image: intern28-sasaki.sakuracr.jp/intern2026-app-frontend:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: on-failure

volumes:
  mariadb_data:

networks:
  default:
    name: app-network
