services:
  api:
    # BACKEND_TAG で焼き分けたイメージを差し替えて性能比較する。
    # 例: BACKEND_TAG=baseline / BACKEND_TAG=optimized (既定は latest)
    image: ${CR_URL}/intern2026-app-backend:${BACKEND_TAG:-latest}
    platform: linux/amd64
    # 直接公開せず proxy 経由でのみアクセスさせる
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
      # フロントが別オリジンになる場合に指定（未指定だと http://localhost:3000 のみ許可）
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      # トレース送信先。ホスト側で動く sacloud-otel-collector の OTLP/HTTP 受信口。
      # 未設定ならトレースを送信しない
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sakuravel-api}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      # どのイメージのトレースかを service.version で区別する。
      # モニタリングスイート側で service.version ごとに応答時間を比較できる。
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${BACKEND_TAG:-latest}
      # - COOKIE_SECURE=true   # HTTPS 配信時
    # コンテナからホスト側（Collector）へ到達するための名前解決
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.11
    command: --event-scheduler=ON
    environment:
      MYSQL_DATABASE: sakuravel
      MYSQL_USER: sakuravel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # ホストへは公開しない（app-network 内から db:3306 で到達できる）
    expose:
      - "3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u sakuravel -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      # HTTPS/証明書なしで動かす構成なので、ローカル用の設定を使う
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    image: ${CR_URL}/intern2026-app-frontend:${FRONTEND_TAG:-latest}
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      # ブラウザから直接叩くURL。デプロイ先ではドメイン名やグローバルIPに変更する
      # （例: http://203.0.113.10:8080）
      - API_URL=${API_URL}:${API_PORT}
    depends_on:
      - api
    restart: on-failure

volumes:
  mariadb_data:

networks:
  default:
    name: app-network
