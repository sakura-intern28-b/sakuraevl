name: Auto Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: docker build & Push
      run: docker buildx build --platform linux/amd64 -f app/backend/Dockerfile -t intern28-b.sakuracr.jp/intern2026-app-backend:latest --push app/backend